appId: com.tek.browser
productName: TEK
copyright: Copyright (c) 2026 Cxly1

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# Snapshot de adblock (listas + scriptlets del dia del build). Va como recurso
# suelto en resources/adblock, NO dentro del asar: Adblock.ts lo lee desde
# process.resourcesPath. Es lo que da proteccion completa en una instalacion
# fresca sin red. Lo genera `pnpm snapshot:adblock` (parte de `pnpm dist`).
extraResources:
  - from: assets/adblock
    to: adblock
    filter:
      - '**/*'

# better-sqlite3 lleva un binario nativo (.node): dentro del asar no se puede
# cargar, asi que se empaqueta desempaquetado al lado.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# El runtime es el fork de castlabs (Widevine). Su version viene de un tag de
# GitHub, que electron-builder no sabe leer del package.json: se la damos aqui.
electronVersion: 37.10.3
# CLAVE: sin esto electron-builder se baja el Electron OFICIAL de esa version
# (sin Widevine) y el instalador sale sin DRM aunque en `pnpm dev` funcione.
# Empaquetamos el runtime de castlabs que ya esta instalado en node_modules.
electronDist: node_modules/electron/dist
# Y el paquete resultante hay que volver a firmarlo con VMP (ver el hook).
# En afterSign, NO en afterPack: electron-builder aun reescribe el .exe entre
# ambos (icono/version) y eso invalida la firma.
afterSign: build/afterSign.cjs
# El binario nativo ya se compila con `pnpm run rebuild` (ABI de Electron).
# Dejar que electron-builder lo reconstruya lo rompe con pnpm.
npmRebuild: false

# De donde se baja la actualizacion automatica. electron-builder ya lo deducia
# del remote de git, pero explicito es lo que acaba dentro del paquete como
# `app-update.yml`, que es lo que lee electron-updater al arrancar.
# OJO AL PUBLICAR: hay que subir `latest.yml` al release JUNTO al .exe. Sin el,
# electron-updater da 404 y nadie se entera de que hay version nueva. (Hasta
# v0.1.1 no se subia a proposito, porque no habia autoactualizacion.)
publish:
  provider: github
  owner: Cxly1
  repo: TEK

win:
  target:
    - nsis
  artifactName: TEK-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TEK
